name: Portable CLI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[test,dev]"
      - run: python -m ruff check aurora_cli tests scripts
      - run: python -m pytest tests -q
      - run: python -m build --no-isolation
      - run: jobia --version
      - run: jobia --color never ui
      - name: Verify install.sh exposes jobia in the calling shell
        if: matrix.python == '3.13' && runner.os != 'Windows'
        shell: bash
        env:
          JOBIA_CONFIG_DIR: ${{ runner.temp }}/install-config
          JOBIA_DATA_DIR: ${{ runner.temp }}/install-data
          JOBIA_NATIVE_BIN: /missing/previous-export/aurora-native
        run: |
          python -m pip uninstall -y jobia-cli
          python - <<'PY'
          import json, os
          from pathlib import Path
          config=Path(os.environ['JOBIA_CONFIG_DIR'])
          config.mkdir(parents=True,exist_ok=True)
          (config/'config.json').write_text(json.dumps({'mode':'remote','server_url':'http://127.0.0.1:9'}))
          PY
          ./install.sh
          python - <<'PY'
          import shutil
          from pathlib import Path
          resolved=shutil.which('jobia')
          assert resolved, 'jobia must be available without a shell restart'
          assert Path(resolved).resolve()==Path('.venv/bin/jobia').resolve(), resolved
          PY
          jobia --version
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.96.1 fmt --manifest-path native/Cargo.toml --check
      - run: cargo +1.96.1 clippy --manifest-path native/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo +1.96.1 test --manifest-path native/Cargo.toml --locked
      - run: cargo +1.96.1 build --manifest-path native/Cargo.toml --release --locked
      - if: runner.os != 'Windows'
        run: python -m pip install -e ".[test]" pyte
      - if: runner.os != 'Windows'
        run: |
          python scripts/validate_terminal.py --depth truecolor --extended --restored
          python scripts/validate_terminal.py --depth color256
          python scripts/validate_terminal.py --depth ansi
          python scripts/validate_terminal.py --depth none
          python scripts/validate_terminal.py --renderer python --depth none --extended --restored
      - run: python scripts/package_native.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: native/dist/*
          if-no-files-found: error
