name: Release verified CLI renderers
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/portable-cli.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag belongs to main and matches package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python -c 'import os; from aurora_cli import __version__; assert os.environ["RELEASE_TAG"] == "v"+__version__'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts
          merge-multiple: true
      - name: Verify complete asset matrix
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from aurora_cli import __version__
          for target in ['aarch64-apple-darwin','x86_64-apple-darwin','x86_64-unknown-linux-gnu','x86_64-pc-windows-msvc']:
              suffix='.exe' if target.endswith('windows-msvc') else ''
              name=f'aurora-native-v{__version__}-{target}{suffix}'
              path=Path('artifacts')/name
              expected=path.with_name(name+'.sha256').read_text().split()[0]
              assert hashlib.sha256(path.read_bytes()).hexdigest()==expected
          PY
      - name: Publish tested binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/* --verify-tag --title "JOBIA $RELEASE_TAG" --notes-file docs/RELEASE.md
  installed:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - if: runner.os == 'Windows'
        run: python -m pip install ".[test]" pyte
      - name: Install through the user entrypoint and resolve bare jobia
        if: runner.os != 'Windows'
        shell: bash
        env:
          JOBIA_CONFIG_DIR: ${{ runner.temp }}/install-config
          JOBIA_DATA_DIR: ${{ runner.temp }}/install-data
          JOBIA_NATIVE_BIN: /missing/previous-export/aurora-native
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          config=Path(os.environ['JOBIA_CONFIG_DIR'])
          config.mkdir(parents=True,exist_ok=True)
          (config/'config.json').write_text(json.dumps({'mode':'remote','server_url':'http://127.0.0.1:9'}))
          PY
          ./install.sh
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          receipt=json.loads(Path('install-receipt.json').read_text())
          assert receipt['ok']
          assert next(s for s in receipt['steps'] if s['id']=='renderer')['status']=='ok'
          resolved=shutil.which('jobia')
          assert resolved, 'jobia must be available in the calling shell without PATH edits'
          assert Path(resolved).resolve()==Path('.venv/bin/jobia').resolve(), resolved
          PY
          jobia --version
          .venv/bin/python -m pip install pyte
      - name: Download and probe the published binary without invoking Cargo
        if: runner.os == 'Windows'
        working-directory: ${{ runner.temp }}
        env:
          JOBIA_NATIVE_BIN: /missing/previous-export/aurora-native
        run: |
          python -m aurora_cli.renderer_install
          python -c "from aurora_cli.renderer import native_binary; from aurora_cli.renderer_install import probe; path=native_binary(); assert path; probe(path); print(path)"
          jobia --version
      - name: Exercise the installed wheel and downloaded renderer in a PTY
        if: runner.os != 'Windows'
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          "$GITHUB_WORKSPACE/.venv/bin/python" "$GITHUB_WORKSPACE/scripts/validate_terminal.py" --source "$RUNNER_TEMP/installed-blank" --launcher jobia --restored --depth truecolor --extended --output "$RUNNER_TEMP/installed-proof"
      - uses: actions/upload-artifact@v4
        if: always() && runner.os != 'Windows'
        with:
          name: installed-proof-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/installed-proof/*
            install-receipt.json
          if-no-files-found: warn
