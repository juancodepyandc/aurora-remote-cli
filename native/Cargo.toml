[package]
name = "aurora-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Optional native terminal renderer for Aurora's Python CLI engine"

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = "0.29.0"
serde_json = "1.0"

[profile.release]
strip = true
lto = "thin"

