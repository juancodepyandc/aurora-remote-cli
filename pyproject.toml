[project]
name = "jobia-cli"
version = "1.2.0"
description = "JOBIA (Juan Of Bike IA) — piloter un modèle local ou un pont distant depuis un seul terminal."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Juan Of Bike IA"}]
keywords = ["ai", "agent", "cli", "local", "llm", "ollama", "remote"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

# Only what is imported. psutil and kaggle were listed but never used.
dependencies = [
    "httpx>=0.27",
    "psutil>=5.9",
    "packaging>=23",
    "rich>=13.0",
    "click>=8.0",
    "prompt-toolkit>=3.0",
    "questionary>=2.0",
    "pygments>=2.0",
    "tomli>=2; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/juancodepyandc/aurora-remote-cli"

[project.scripts]
jobia = "aurora_cli.cli:main"
jbia = "aurora_cli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aurora_cli*"]

[tool.setuptools.package-data]
aurora_cli = ["policies/*.toml"]
