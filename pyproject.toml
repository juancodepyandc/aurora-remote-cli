[project]
name = "aurora-cli"
version = "1.0.0"
description = "Aurora AI Agent — Remote CLI Client. Lightweight terminal interface to control Aurora running on a remote server."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Aurora Team"}]
keywords = ["ai", "agent", "cli", "aurora", "remote"]

dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "click>=8.0",
    "prompt-toolkit>=3.0",
    "questionary>=2.0",
    "psutil>=5.9",
    "kaggle>=1.6",
]

[project.scripts]
aurora = "aurora_cli.cli:main"
jobia = "aurora_cli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aurora_cli*"]
