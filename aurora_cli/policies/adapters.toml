# Runner manifests — how each capability is actually executed.
#
# Read by aurora_cli/adapters.py. Adding a model, a capability or a platform is an
# edit here; the Python does not change.
#
# `argv` uses typed placeholders the caller substitutes. They become single argv
# entries, so a path containing spaces cannot smuggle in extra arguments.
#
# `env` declares environment a backend needs. The MPS watermark entries are not
# decoration: torch ships an invalid default that crashes the first large MPS
# buffer, which is why the engine root previously crashed on load.

[runner.hunyuan3d]
capability = "3d"
worker = "mesh_worker.py"
provisioner = "hunyuan"
priority = 10
texturing = true
# The engine venv owns the GPU libraries; the CLI process never imports them.
interpreter = "engine"
provides = ["output_nonempty", "mesh_valid", "has_texture"]
specs = ["tencent/Hunyuan3D-2.1", "hunyuan3d-2.1"]
argv = """
  {interpreter}
  {worker}
  --root {root} --repo {repo} --image {image} --output {output}
  --model {model} --octree-resolution {octree} --shape-steps {steps}
  --min-bbox-fill {min_bbox_fill} {paint_flag}
"""
env = [
  "PYTORCH_ENABLE_MPS_FALLBACK=1",
  "PYTORCH_MPS_HIGH_WATERMARK_RATIO=1.0",
  "PYTORCH_MPS_LOW_WATERMARK_RATIO=1.0",
]
[runner.hunyuan3d.parameters]
octree = 384
steps = 50
min_bbox_fill = 0.05

# Declared so the gap is a fact in the manifest rather than a surprise at runtime.
# A runner is only added here once it exists and can be probed.
[runner.sdxl]
capability = "image"
worker = "image_worker.py"
provisioner = "diffusers"
interpreter = "engine"
provides = ["output_nonempty", "image_valid", "not_flat"]
specs = [
  "stabilityai/stable-diffusion-xl-base-1.0", "stable-diffusion-xl-base-1.0",
  "stabilityai/sdxl-turbo", "sdxl-turbo",
  "black-forest-labs/FLUX.1-schnell", "black-forest-labs/FLUX.1-dev",
]
argv = """
  {interpreter}
  {worker}
  {model_dir} {prompt} {output} --seed {seed} --negative={negative} --model-spec {model_spec}
"""

# Verified upstream API, not a claim of measured superiority on this host.
# https://github.com/microsoft/TRELLIS.2
[runner.trellis2]
capability = "3d"
texturing = true
priority = 30
systems = ["Linux"]
accelerators = ["cuda"]
min_vram_gb = 24
specs = ["microsoft/TRELLIS.2-4B"]
worker = "trellis_worker.py"
provisioner = "native"
repository = "https://github.com/microsoft/TRELLIS.2.git"
revision = "75fbf0183001ed9876c8dbb35de6b68552ee08bd"
torch_packages = ["torch==2.6.0", "torchvision==0.21.0"]
torch_index = "https://download.pytorch.org/whl/cu124"
packages = ["Pillow", "numpy", "imageio", "imageio-ffmpeg", "tqdm", "easydict", "opencv-python-headless", "ninja", "trimesh", "transformers>=4.56,<5", "huggingface_hub", "safetensors", "kornia", "timm", "einops", "scipy", "zstandard", "packaging", "psutil", "tensorboard", "pandas", "lpips", "git+https://github.com/EasternJournalist/utils3d.git@9a4eb15e4021b67b12c460c7057d642626897ec8", "flash-attn==2.7.3"]
probe_imports = ["torch", "trellis2.pipelines", "o_voxel", "cumesh", "flex_gemm"]
provides = ["output_nonempty", "mesh_valid", "has_texture"]
argv = ["{interpreter}", "{worker}", "--root", "{root}", "--repo", "{repo}", "--image", "{image}", "--output", "{output}", "--model", "{model}", "--family", "trellis2", "--texture-size", "{texture_size}", "--resolution", "{resolution}", "--target-faces", "{target_faces}", "{paint_flag}"]
[runner.trellis2.parameters]
texture_size = 2048
resolution = 512
target_faces = 100000
[[runner.trellis2.extensions]]
repository = "https://github.com/NVlabs/nvdiffrast.git"
revision = "253ac4fcea7de5f396371124af597e6cc957bfae"
[[runner.trellis2.extensions]]
repository = "https://github.com/JeffreyXiang/nvdiffrec.git"
revision = "b296927cc7fd01c2ac1087c8065c4d7248f72da4"
package_subdirectory = "render/renderutils"
[[runner.trellis2.extensions]]
repository = "https://github.com/JeffreyXiang/CuMesh.git"
revision = "12289e1062f0603f2f0d0771b02e1395d247f26f"
[[runner.trellis2.extensions]]
repository = "https://github.com/JeffreyXiang/FlexGEMM.git"
revision = "6dd94a859c26ee8246888502eada3dd8ad85532e"
[[runner.trellis2.extensions]]
subdirectory = "o-voxel"

# Required by pipeline.json. The background component uses the upstream
# BiRefNet wrapper's open default, not gated RMBG-2.0. This is compatibility,
# not a claim of higher matte quality. Local source/config hashes are checked.
[[runner.trellis2.dependencies]]
spec = "microsoft/TRELLIS-image-large"
include = ["ckpts/ss_dec_conv3d_16l8_fp16.json", "ckpts/ss_dec_conv3d_16l8_fp16.safetensors"]
[[runner.trellis2.dependencies]]
spec = "facebook/dinov3-vitl16-pretrain-lvd1689m"
include = ["config.json", "model.safetensors", "preprocessor_config.json"]
[[runner.trellis2.dependencies]]
spec = "ZhengPeng7/BiRefNet"
for_spec = "briaai/RMBG-2.0"
revision = "e2bf8e4460fc8fa32bba5ea4d94b3233d367b0e4"
include = ["config.json", "model.safetensors", "BiRefNet_config.py", "birefnet.py"]
[runner.trellis2.dependencies.hashes]
"config.json" = "c97ea21569daf66b205491a4635147dd3bc42c7c168b89d7d75b53f67ef548ae"
"BiRefNet_config.py" = "e7b8c2a74f6cea6a59553d517f71d47f2c1d90e670a13416af17c25fe2f3dc52"
"birefnet.py" = "208771ae626f653d64128fbf2d6ac9f8e645c5cc5e286258a73ec3322bbfe5ef"

[runner.flux2]
capability = "image"
priority = 20
specs = ["black-forest-labs/FLUX.2-klein-4B"]
worker = "image_worker.py"
provisioner = "diffusers"
packages = ["torch", "diffusers>=0.37.0", "transformers", "accelerate", "safetensors", "Pillow", "sentencepiece", "protobuf"]
provides = ["output_nonempty", "image_valid", "not_flat"]
argv = ["{interpreter}", "{worker}", "{model_dir}", "{prompt}", "{output}", "--seed", "{seed}", "--negative={negative}", "--model-spec", "{model_spec}"]

# Ollama has a standard, probed API; these roles are not Python/GPU workers.
[runner.ollama-text]
capability = "llm"
provisioner = "ollama"
provides = ["served_model", "complete_response"]
argv = ["{model}"]
[runner.ollama-vision]
capability = "vision"
provisioner = "ollama"
provides = ["served_model", "vision_capability", "complete_response"]
argv = ["{model}"]

[runner.whisper]
capability = "audio"
specs = ["openai/whisper-tiny", "openai/whisper-large-v3"]
worker = "audio_worker.py"
provisioner = "transformers"
packages = ["torch", "transformers", "accelerate", "safetensors", "numpy", "scipy", "soundfile"]
provides = ["output_nonempty", "transcript_complete"]
argv = ["{interpreter}", "{worker}", "--task", "transcribe", "--model", "{model_dir}", "--input", "{input}", "--output", "{output}"]

[runner.vits-french]
capability = "tts"
specs = ["facebook/mms-tts-fra"]
worker = "audio_worker.py"
provisioner = "transformers"
packages = ["torch", "transformers", "accelerate", "safetensors", "numpy", "scipy", "soundfile", "uroman"]
provides = ["output_nonempty", "waveform_valid"]
argv = ["{interpreter}", "{worker}", "--task", "speak", "--model", "{model_dir}", "--text", "{text}", "--output", "{output}"]
